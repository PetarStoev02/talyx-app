name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      # The ratchet test compares the allowlists with main's copy, so it needs main's history.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Unit tests import website/ sources, so give them its packages too.
      - name: Install website dependencies
        run: npm ci --prefix website

      - name: Run tests
        run: npm test

  website:
    name: Website
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json

      # Build first with website/node_modules alone, as Vercel does; the typecheck reads the app's
      # sources too, so it needs the root install.
      - name: Install website dependencies
        run: npm ci --prefix website

      - name: Build
        run: npm run build --prefix website

      - name: Install app dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -p website --noEmit

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx electron-vite build

  # One mapped feature (settings-theme) and a seeded fuzz in the real window, with no engine.
  # Runs on every push to main, and on a PR that touches the renderer, the driver or this file;
  # any other PR passes it at once, so the job can be a required check.
  ui:
    name: UI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CONTROL: node .claude/skills/verify-talyx/control-talyx.mjs
      EVIDENCE: /tmp/talyx-verify/evidence
      DISPLAY: ':99'

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Does the PR touch the UI
        id: scope
        run: |
          if [ "${{ github.event_name }}" != pull_request ] || git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" HEAD -- src/renderer \
            .claude/skills/verify-talyx .github/workflows/ci.yml | grep -q .; then
            echo run=true >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.scope.outputs.run
        with:
          node-version: 24
          cache: npm

      - uses: actions/cache@v4
        if: steps.scope.outputs.run
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Electron downloads its binary on first use (install-electron), into the cache above.
      - name: Install dependencies
        if: steps.scope.outputs.run
        run: npm ci && npx install-electron

      # Ubuntu's AppArmor blocks the user namespaces Chromium's sandbox needs; Xvfb is the screen.
      - name: Start a virtual display
        if: steps.scope.outputs.run
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          Xvfb :99 -screen 0 1280x800x24 &

      - name: Settings theme (features/settings-theme.md)
        if: steps.scope.outputs.run
        run: |
          set -euo pipefail
          out="$EVIDENCE/settings-theme"
          mkdir -p "$out"
          echo '{"setupDone": true}' > /tmp/seed.json
          $CONTROL launch --no-engine --seed /tmp/seed.json
          $CONTROL browser click --role button --name Settings --exact
          $CONTROL browser wait --role heading --name 'Settings: General'
          $CONTROL browser screenshot --path "$out/before.png"
          $CONTROL browser click --role button --name Dark --exact
          $CONTROL browser snapshot --path "$out/after.aria.txt"
          $CONTROL browser screenshot --path "$out/after.png"
          $CONTROL settings > "$out/settings.json"
          grep -F 'button "Dark" [pressed]' "$out/after.aria.txt"
          node -e 'process.exit(require(process.argv[1]).theme === "dark" ? 0 : 1)' \
            "$out/settings.json"
          $CONTROL stop

      # A failing seed replays locally: launch --no-engine with the same seed file, then fuzz.
      - name: Fuzz (seed = run number)
        if: steps.scope.outputs.run
        run: |
          set -euo pipefail
          $CONTROL launch --no-engine --seed /tmp/seed.json
          $CONTROL fuzz --steps 100 --seed ${{ github.run_number }}
          $CONTROL stop

      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.run
        with:
          name: ui-evidence
          path: |
            /tmp/talyx-verify/evidence
            /tmp/talyx-verify/run/talyx.log
          if-no-files-found: warn

      # After the upload: stop removes the run directory, log included.
      - name: Stop the app
        if: always() && steps.scope.outputs.run
        run: $CONTROL stop || true
