<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<!-- The dev-run icon (Talyx Dev): the logo on a night sky. talyx-icon-dev.png is this file rendered at 1024px. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141945"/>
      <stop offset="0.55" stop-color="#1b1850"/>
      <stop offset="1" stop-color="#2a1a5c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.62" cy="0.22" r="0.45">
      <stop offset="0" stop-color="#3a4590" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3a4590" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="frontTop" gradientUnits="userSpaceOnUse" x1="100" y1="600" x2="924" y2="1000"><stop offset="0" stop-color="#8f97ea"/><stop offset="1" stop-color="#8a6ad0"/></linearGradient>
    <linearGradient id="frontBody" gradientUnits="userSpaceOnUse" x1="100" y1="600" x2="924" y2="1000"><stop offset="0" stop-color="#6c74d4"/><stop offset="1" stop-color="#6a45b0"/></linearGradient>
    <linearGradient id="backTop" gradientUnits="userSpaceOnUse" x1="560" y1="400" x2="924" y2="900"><stop offset="0" stop-color="#6e77d2"/><stop offset="1" stop-color="#6a4fb8"/></linearGradient>
    <linearGradient id="backBody" gradientUnits="userSpaceOnUse" x1="560" y1="400" x2="924" y2="900"><stop offset="0" stop-color="#4e56b6"/><stop offset="1" stop-color="#4f3696"/></linearGradient>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <mask id="logo" maskUnits="userSpaceOnUse" x="0" y="0" width="226" height="251"><path d="M97.89 4.05A30.22 30.22 0 0 1 128.11 4.05L210.63 51.69A30.22 30.22 0 0 1 225.73 77.86L225.73 173.14A30.22 30.22 0 0 1 210.63 199.31L128.11 246.95A30.22 30.22 0 0 1 97.89 246.95L15.37 199.31A30.22 30.22 0 0 1 0.27 173.14L0.27 77.86A30.22 30.22 0 0 1 15.37 51.69Z" fill="white"/><path d="M24.42 176.64L113 227.78L113 125.5L24.42 74.36Z" fill="black"/><path d="M133.13 188.26L157.29 202.21L157.29 99.93L68.71 48.79L68.71 76.68L133.13 113.88Z" fill="black"/><path d="M177.42 162.69L201.58 176.64L201.58 74.36L113 23.22L113 51.11L177.42 88.31Z" fill="black"/></mask>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0a0820" flood-opacity="0.55"/>
    </filter>
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#141945" filter="url(#tileShadow)"/>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#sky)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <!-- stars -->
    <g fill="#e8e9ff">
      <circle cx="210" cy="215" r="5"/><circle cx="452" cy="182" r="4"/><circle cx="828" cy="232" r="4"/>
      <circle cx="165" cy="520" r="4"/><circle cx="860" cy="640" r="4.5"/><circle cx="700" cy="160" r="3"/>
      <circle cx="245" cy="380" r="3"/><circle cx="790" cy="420" r="3"/>
    </g>
    <g stroke="#b8bcf5" stroke-width="3" stroke-linecap="round">
      <path d="M296 234v20M286 244h20"/><path d="M846 330v18M837 339h18"/><path d="M178 700v16M170 708h16"/>
    </g>
    <!-- back cloud, right -->
    <g opacity="0.95"><g fill="url(#backTop)"><circle cx="905" cy="560" r="150"/><circle cx="770" cy="650" r="105"/><circle cx="660" cy="760" r="95"/><circle cx="820" cy="780" r="160"/><circle cx="960" cy="760" r="140"/></g><g fill="url(#backBody)"><circle cx="905" cy="586" r="150"/><circle cx="770" cy="676" r="105"/><circle cx="660" cy="786" r="95"/><circle cx="820" cy="806" r="160"/><circle cx="960" cy="786" r="140"/></g>
</g>
    <!-- front cloud, left and bottom -->
    <g fill="url(#frontTop)"><circle cx="150" cy="770" r="175"/><circle cx="390" cy="850" r="140"/><circle cx="330" cy="960" r="140"/><circle cx="600" cy="905" r="120"/><circle cx="560" cy="1000" r="140"/><circle cx="830" cy="925" r="115"/><circle cx="880" cy="1010" r="140"/><circle cx="100" cy="960" r="160"/></g><g fill="url(#frontBody)"><circle cx="150" cy="800" r="175"/><circle cx="390" cy="880" r="140"/><circle cx="330" cy="990" r="140"/><circle cx="600" cy="935" r="120"/><circle cx="560" cy="1030" r="140"/><circle cx="830" cy="955" r="115"/><circle cx="880" cy="1040" r="140"/><circle cx="100" cy="990" r="160"/></g>
    <!-- logo -->
    <g filter="url(#lift)">
      <g transform="translate(308.6 280.1) scale(1.8)">
        <rect width="226" height="251" fill="#ffffff" mask="url(#logo)"/>
      </g>
    </g>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184" fill="none" stroke="url(#edge)" stroke-width="3"/>
</svg>
