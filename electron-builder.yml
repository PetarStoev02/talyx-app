appId: com.talyx.app
productName: Talyx
# Talyx does not use electron-updater; without this electron-builder detects a GitHub
# target from package.json and writes app-update.yml, latest-mac.yml and blockmaps.
publish: null
directories:
  buildResources: build
files:
  # Allowlist: electron-vite output and runtime assets only. electron-builder adds
  # package.json and production node_modules itself.
  - out/**
  - resources/**
extraResources:
  - from: LICENSE
    to: LICENSE
  - from: CREDITS.md
    to: CREDITS.md
asarUnpack:
  - resources/**
mac:
  # Only build/icon.icns is found by convention; without this the app gets Electron's icon.
  icon: build/talyx-icon.icns
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  # No Apple account: ad-hoc signature ('-'). Apple Silicon refuses an unsigned binary,
  # and flipping the fuses below invalidates any earlier signature, so sign last.
  identity: '-'
  # macOS asks for the microphone with this line the first time you dictate.
  extendInfo:
    NSMicrophoneUsageDescription: Talyx uses the microphone to turn what you say into a message.
  hardenedRuntime: false
  notarize: false
dmg:
  artifactName: ${productName}-${arch}.${ext}
linux:
  icon: build/talyx-icon.png
  category: Utility
  target:
    - target: AppImage
      arch: x64
    - target: deb
      arch: x64
  # AppImage becomes Talyx-x86_64.AppImage and deb Talyx-amd64.deb (electron-builder maps ${arch}
  # per target); no spaces, so the release asset names match what the updater looks for.
  artifactName: ${productName}-${arch}.${ext}
deb:
  packageName: talyx
  # electron-builder's defaults plus the sound library Electron links against; Ubuntu 24.04
  # renamed it to libasound2t64, so a minimal install otherwise fails to start Talyx.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2t64 | libasound2
# No native dependencies, so nothing is compiled against Electron's headers.
npmRebuild: false
# Any local process could otherwise run code as Talyx and inherit its permissions.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  # The renderer is served over app:// (appProtocol.ts), so file:// pages need no extra reach.
  grantFileProtocolExtraPrivileges: false
