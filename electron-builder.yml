appId: com.talyx.app
productName: Talyx
# Talyx does not use electron-updater; without this electron-builder detects a GitHub
# target from package.json and writes app-update.yml, latest-mac.yml and blockmaps.
publish: null
directories:
  buildResources: build
files:
  # Allowlist: electron-vite output and runtime assets only. electron-builder adds
  # package.json and production node_modules itself.
  - out/**
  - resources/**
extraResources:
  - from: LICENSE
    to: LICENSE
  - from: CREDITS.md
    to: CREDITS.md
asarUnpack:
  - resources/**
mac:
  # Only build/icon.icns is found by convention; without this the app gets Electron's icon.
  icon: build/talyx-icon.icns
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  # No Apple account: ad-hoc signature ('-'). Apple Silicon refuses an unsigned binary,
  # and flipping the fuses below invalidates any earlier signature, so sign last.
  identity: '-'
  hardenedRuntime: false
  notarize: false
dmg:
  artifactName: ${productName}-${arch}.${ext}
# No native dependencies, so nothing is compiled against Electron's headers.
npmRebuild: false
# Any local process could otherwise run code as Talyx and inherit its permissions.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
