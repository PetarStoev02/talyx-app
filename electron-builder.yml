appId: com.talyx.app
productName: Talyx
# electron-updater's feed. The builds run with --publish never: this only writes app-update.yml
# into the app and latest-mac.yml, latest-linux.yml and blockmaps into dist/, which the Release
# workflow and scripts/release.sh attach to the draft release. Drafts are invisible to the feed.
publish:
  provider: github
  owner: PetarStoev02
  repo: talyx-app
# talyx:// links (talyx://activate?key=...) open Talyx: CFBundleURLTypes on macOS, the
# x-scheme-handler MimeType in the Linux desktop entry. An AppImage without a desktop entry
# may get no handler; "Enter License Key..." in the app menu works everywhere.
protocols:
  - name: Talyx
    schemes:
      - talyx
directories:
  buildResources: build
files:
  # Allowlist: electron-vite output and runtime assets only. electron-builder adds
  # package.json and production node_modules itself.
  - out/**
  - resources/**
extraResources:
  - from: LICENSE
    to: LICENSE
  - from: CREDITS.md
    to: CREDITS.md
asarUnpack:
  - resources/**
mac:
  # Only build/icon.icns is found by convention; without this the app gets Electron's icon.
  icon: build/talyx-icon.icns
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    # Squirrel.Mac installs updates from the zip. Both architectures build in one run, so a single
    # latest-mac.yml lists both zips and electron-updater picks the one naming arm64 on Apple Silicon.
    - target: zip
      arch:
        - x64
        - arm64
  # The zips: Talyx-x64.zip and Talyx-arm64.zip (the DMG sets its own name below).
  artifactName: ${productName}-${arch}.${ext}
  # No identity here: electron-builder finds the Developer ID Application certificate that
  # CSC_LINK/CSC_KEY_PASSWORD (or the keychain) provides. Without one the build stays unsigned
  # and electronFuses.resetAdHocDarwinSignature below keeps it runnable on Apple Silicon.
  # macOS asks for the microphone with this line the first time you dictate.
  extendInfo:
    NSMicrophoneUsageDescription: Talyx uses the microphone to turn what you say into a message.
  # Notarization requires the hardened runtime; the entitlements file justifies each exception.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Notarizes and staples the .app when APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID
  # are set, or APPLE_KEYCHAIN_PROFILE in their place; with none of them it warns and skips.
  notarize: true
dmg:
  # Signs the DMG with the same Developer ID; a no-op when there is no identity.
  sign: true
  artifactName: ${productName}-${arch}.${ext}
  # Updates come from the zip. The DMG is stapled after the build, which would leave a hash for it
  # in latest-mac.yml (and its blockmap) that no longer matches the uploaded file.
  writeUpdateInfo: false
linux:
  icon: build/talyx-icon.png
  category: Utility
  target:
    - target: AppImage
      arch: x64
    - target: deb
      arch: x64
  # AppImage becomes Talyx-x86_64.AppImage and deb Talyx-amd64.deb (electron-builder maps ${arch}
  # per target); no spaces, so the release asset names match what the updater looks for.
  artifactName: ${productName}-${arch}.${ext}
deb:
  packageName: talyx
  # electron-builder's defaults plus the sound library Electron links against; Ubuntu 24.04
  # renamed it to libasound2t64, so a minimal install otherwise fails to start Talyx.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2t64 | libasound2
# No native dependencies, so nothing is compiled against Electron's headers.
npmRebuild: false
# The static AppImage runtime carries its own FUSE 3 code, so the AppImage starts on systems
# without libfuse.so.2 (the legacy runtime's requirement). Self-update is unaffected: both
# runtimes get the same AppRun and embedded blockmap, and electron-updater moves the new file over
# the old one.
toolsets:
  appimage: '1.0.3'
# Any local process could otherwise run code as Talyx and inherit its permissions.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  # The renderer is served over app:// (appProtocol.ts), so file:// pages need no extra reach.
  grantFileProtocolExtraPrivileges: false
  # Flipping fuses breaks the binary's signature. electron-builder re-signs a release after this,
  # but a local build with no Developer ID is never signed, and Apple Silicon refuses to run it.
  resetAdHocDarwinSignature: true
