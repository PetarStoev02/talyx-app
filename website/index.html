    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Talyx — Tell your Mac what to do" />

      property="og:description"
      content="One shortcut, your own Claude, approval before anything changes. Free and open source."
    />
    <meta property="og:url" content="https://talyx.app" />
    <meta property="og:site_name" content="Talyx" />

    <!--seo:jsonld-->

    <script>
      // Blocking script: apply theme before paint to prevent flash
      ;(function () {
        var t = localStorage.getItem('talyx-theme')
        var dark =
          t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
      })()
    </script>

    <div id="root"><!--ssr-outlet--></div>
