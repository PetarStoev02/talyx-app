    <script>
      // Blocking script: apply theme before paint to prevent flash
      ;(function () {
        var t = null
        try {
          t = localStorage.getItem('talyx-theme')
        } catch (e) {
          // Blocked storage throws; follow the system theme.
        }
        var dark =
          t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
        // Entrance motion is opt-in: if the app never boots, drop it so nothing stays hidden.
        var REVEAL_FALLBACK_MS = 4000
        document.documentElement.classList.add('js')
        setTimeout(function () {
          if (!window.__talyxBooted) document.documentElement.classList.remove('js')
        }, REVEAL_FALLBACK_MS)
      })()
    </script>

  <body>
    <div id="root"><!--ssr-outlet--></div>

  </body>
