<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Talyx demo</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
    </style>
    <script>
      // Sandboxed in an opaque origin, so the site's storage is out of reach: the page that
      // embeds this posts its theme (see AppEmbed.tsx), and this answers once it is applied.
      // Until then, and when opened on its own, it follows the OS. Inline, to theme before paint.
      ;(function () {
        var media = window.matchMedia('(prefers-color-scheme: dark)')
        var fromParent = false
        function apply(dark) {
          document.documentElement.className = dark ? 'dark' : 'light'
        }
        apply(media.matches)
        media.addEventListener('change', function () {
          if (!fromParent) apply(media.matches)
        })
        window.addEventListener('message', function (event) {
          var data = event.data
          if (event.source !== window.parent || !data || data.type !== 'talyx-theme') return
          if (data.theme !== 'dark' && data.theme !== 'light') return
          fromParent = true
          apply(data.theme === 'dark')
          window.parent.postMessage({ type: 'talyx-demo-ready' }, '*')
        })
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app-demo/main.tsx"></script>
  </body>
</html>
